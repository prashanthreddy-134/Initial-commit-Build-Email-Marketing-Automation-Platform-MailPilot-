{% extends "base.html" %}{% block content %}<h1>Automation sequences</h1><div class="card card-body mb-3"><form method="post"><input class="form-control mb-2" name="name" placeholder="Sequence name" required><input class="form-control mb-2" name="subject" placeholder="Email subject" required><textarea class="form-control mb-2" name="html_content" rows="5" placeholder="HTML email" required></textarea><label>Delay in days</label><input class="form-control mb-2" type="number" min="0" name="delay_days" value="0"><button class="btn btn-primary">Create sequence</button></form></div>{% for seq in sequences %}<div class="card card-body mb-3"><h5>{{ seq.name }}</h5><p>{{ seq.subject }} · Delay {{ seq.delay_days }} day(s)</p><form method="post" action="{{ url_for('enroll_sequence',seqid=seq.id) }}"><select class="form-select mb-2" name="subscriber_ids" multiple size="4">{% for s in subscribers %}<option value="{{ s.id }}">{{ s.email }}</option>{% endfor %}</select><button class="btn btn-outline-primary">Enroll selected</button></form></div>{% else %}<p>No sequences yet.</p>{% endfor %}<p class="text-muted">Run <code>flask --app app run-scheduler</code> periodically to process due messages.</p>{% endblock %}

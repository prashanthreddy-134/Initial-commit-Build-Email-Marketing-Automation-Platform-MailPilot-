<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}MailPilot{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static',filename='style.css') }}" rel="stylesheet"></head><body><nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}">MailPilot</a>{% if current_user.is_authenticated %}<div class="navbar-nav flex-row flex-wrap gap-3"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a><a class="nav-link" href="{{ url_for('subscribers') }}">Subscribers</a><a class="nav-link" href="{{ url_for('segments') }}">Segments</a><a class="nav-link" href="{{ url_for('templates') }}">Templates</a><a class="nav-link" href="{{ url_for('campaigns') }}">Campaigns</a><a class="nav-link" href="{{ url_for('sequences') }}">Sequences</a><a class="nav-link" href="{{ url_for('analytics') }}">Analytics</a><form method="post" action="{{ url_for('logout') }}"><button class="btn btn-sm btn-outline-light">Logout</button></form></div>{% endif %}</div></nav><main class="container py-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }} alert-dismissible">{{ message }}<button class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>

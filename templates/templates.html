{% extends "base.html" %}{% block content %}<h1>Email templates</h1><div class="card card-body mb-3"><form method="post"><input class="form-control mb-2" name="name" placeholder="Template name" required><input class="form-control mb-2" name="subject" placeholder="Subject" required><textarea class="form-control mb-2" name="html_content" rows="6" placeholder="HTML email content" required></textarea><button class="btn btn-primary">Save template</button></form></div>{% for t in templates %}<div class="card card-body mb-2"><strong>{{ t.name }}</strong>{{ t.subject }}<pre class="mb-0">{{ t.html_content }}</pre></div>{% else %}<p>No templates saved.</p>{% endfor %}{% endblock %}

{% extends "base.html" %}{% block content %}<h1>Segments</h1><div class="card card-body mb-3"><form method="post"><input class="form-control mb-2" name="name" placeholder="Segment name" required><textarea class="form-control mb-2" name="description" placeholder="Description"></textarea><label class="form-label">Add active subscribers</label><select class="form-select mb-3" name="subscriber_ids" multiple size="5">{% for s in subscribers %}<option value="{{ s.id }}">{{ s.email }}</option>{% endfor %}</select><button class="btn btn-primary">Create segment</button></form></div>{% for s in segments %}<div class="card card-body mb-2"><strong>{{ s.name }}</strong><span class="text-muted">{{ s.description }}</span><small>{{ s.id }}</small></div>{% else %}<p>No segments yet.</p>{% endfor %}{% endblock %}

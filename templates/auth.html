{% extends "base.html" %}{% block title %}{{ mode }} | MailPilot{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-md-5"><div class="card shadow-sm"><div class="card-body p-4"><h2>{{ mode }}</h2><form method="post">{% if mode=="Register" %}<label class="form-label">Username</label><input class="form-control mb-3" name="username" required minlength="3"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>{% else %}<label class="form-label">Username or email</label><input class="form-control mb-3" name="identity" required>{% endif %}<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required minlength="8"><button class="btn btn-primary w-100">{{ mode }}</button></form><p class="mt-3 mb-0">{% if mode=="Register" %}Already registered? <a href="{{ url_for('login') }}">Login</a>{% else %}New here? <a href="{{ url_for('register') }}">Create account</a>{% endif %}</p></div></div></div></div>{% endblock %}
